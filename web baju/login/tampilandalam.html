<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Products - NPD CLUB</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --red:#ff1a1a;
    --red-dark:#7a0000;
    --line:#1c1c1c;
    --card:#0a0a0a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--red);font-family:'Poppins',sans-serif;font-size:13px}
  a{color:inherit;text-decoration:none}

  /* ---------- HEADER ---------- */
  header{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:0 12px;height:120px;
  }
  .nav-left,.nav-right{display:flex;align-items:center;gap:26px;font-size:12px;font-weight:500;text-transform:uppercase}
  .nav-right{justify-content:flex-end}
  .nav-left .dd{display:flex;align-items:center;gap:10px;cursor:pointer}
  .btn-shop{
    border:1.5px solid #fff;color:#fff;border-radius:14px;
    padding:12px 15px;font-size:12px;font-weight:500;
  }
  .logo{color:#fff;font-size:28px;font-weight:600;letter-spacing:1px}
  .logo span{margin-right:2px}
  .currency{display:flex;align-items:center;gap:5px}
  .flag{width:15px;height:10px;background:linear-gradient(#e70011 50%,#fff 50%)}
  svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}

  /* ---------- LAYOUT ---------- */
  .wrap{
    display:grid;grid-template-columns:262px 1fr;gap:12px;
    max-width:1366px;margin:0 auto;padding:12px 112px 60px 124px;
  }
  .wrap{padding-left:124px;padding-right:112px}

  /* ---------- SIDEBAR ---------- */
  aside{border:1px solid var(--line);border-radius:4px;align-self:start}
  .search-box{
    margin:8px;border:1px solid var(--line);border-radius:4px;
    display:flex;align-items:center;gap:10px;padding:12px 12px;
  }
  .search-box input{
    background:none;border:0;outline:0;color:var(--red);width:100%;
    font-family:inherit;font-size:12px;
  }
  .search-box input::placeholder{color:var(--red-dark)}
  .filter{border-top:1px solid var(--line);padding:16px 6px 12px}
  .filter-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:0 10px 0 0;cursor:pointer;font-weight:500;
  }
  .filter-head svg{width:14px;height:14px;transition:transform .2s}
  .filter.closed .filter-head svg{transform:rotate(180deg)}
  .filter.closed .filter-body{display:none}
  .filter-body{margin-top:18px;display:flex;flex-direction:column;gap:12px}
  .opt{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px}
  .opt input{display:none}
  .box,.radio{
    width:12px;height:12px;border:1.5px solid #fff;display:inline-block;position:relative;flex:none;
  }
  .radio{border-radius:50%}
  .opt input:checked + .box{background:var(--red)}
  .opt input:checked + .radio::after{
    content:"";position:absolute;inset:2px;border-radius:50%;background:#fff;
  }
  .see-more{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px}
  .price-row{display:flex;gap:8px}
  .price-row input{
    width:100%;background:none;border:1px solid var(--line);border-radius:4px;
    color:var(--red);padding:8px;font-family:inherit;font-size:12px;outline:0;
  }

  /* ---------- CONTENT ---------- */
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;margin-top:2px}
  .topbar h1{font-size:16px;font-weight:500}
  .sort{
    border:1px solid var(--line);border-radius:4px;padding:8px 10px;
    font-size:11px;font-weight:500;display:flex;gap:6px;align-items:center;
  }
  .sort select{
    background:none;border:0;color:var(--red);font-family:inherit;font-size:11px;
    font-weight:500;outline:0;cursor:pointer;
  }
  .sort select option{background:#000}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:19px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer}
  .card .img{position:relative;background:#fff;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
  .card .img svg{width:70%;height:70%}
  .badge{
    position:absolute;top:6px;left:6px;background:var(--red-dark);color:#2a0000;
    font-size:9px;font-weight:600;padding:2px 6px;text-transform:uppercase;
  }
  .card .info{padding:16px 10px 10px;text-align:center;font-size:11px;font-weight:500;line-height:1.5}
  .card .name{text-transform:uppercase}
  .card:hover .name{color:#fff}
  .empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--red-dark)}

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:1100px){.wrap{padding:12px 24px 60px}}
  @media (max-width:820px){
    header{grid-template-columns:1fr;height:auto;gap:14px;padding:16px;justify-items:center}
    .nav-left,.nav-right{justify-content:center;flex-wrap:wrap;gap:14px}
    .wrap{grid-template-columns:1fr}
    .grid{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="nav-left">
    <div class="dd">BRAND
      <svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="dd">COLLECTIONS
      <svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <a href="#" class="btn-shop">SHOP NOW</a>
  </div>

  <a href="#" class="logo"><span></span>NPD CLUB</a>

  <div class="nav-right">
    <div class="currency"><i class="flag"></i> IDR</div>
    <svg class="ic" viewBox="0 0 24 24" style="width:22px;height:22px"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <a href="#">CHART</a>
    <a href="#">LOG IN</a>
  </div>
</header>

<div class="wrap">
  <!-- SIDEBAR -->
  <aside>
    <label class="search-box">
      <svg class="ic" viewBox="0 0 24 24" style="width:20px;height:20px"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="Search">
    </label>

    <div class="filter">
      <div class="filter-head">Categories
        <svg class="ic" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
      </div>
      <div class="filter-body">
        <label class="opt"><input type="checkbox" name="cat" value="NPD COLLECTION"><i class="box"></i>NPD COLLECTION</label>
        <label class="opt"><input type="checkbox" name="cat" value="SPRING COLLECTION"><i class="box"></i>SPRING COLLECTION</label>
        <label class="opt"><input type="checkbox" name="cat" value="LIMITED COLLECTIOM"><i class="box"></i>LIMITED COLLECTION</label>
        <label class="opt"><input type="checkbox" name="cat" value="Moskva 24"><i class="box"></i>Moskva 24</label>
        <label class="opt"><input type="checkbox" name="cat" value="Back To Block 25"><i class="box"></i>Back To Block 25</label>
        <div class="see-more">See More
          <svg class="ic" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
    </div>

    <div class="filter">
      <div class="filter-head">Product Type
        <svg class="ic" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
      </div>
      <div class="filter-body">
        <label class="opt"><input type="radio" name="ptype" value="all" checked><i class="radio"></i>All Products</label>
        <label class="opt"><input type="radio" name="ptype" value="featured"><i class="radio"></i>Featured Products</label>
      </div>
    </div>

    <div class="filter">
      <div class="filter-head">Availability
        <svg class="ic" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
      </div>
      <div class="filter-body">
        <label class="opt"><input type="radio" name="avail" value="all" checked><i class="radio"></i>All</label>
        <label class="opt"><input type="radio" name="avail" value="in"><i class="radio"></i>In Stock</label>
      </div>
    </div>

    <div class="filter">
      <div class="filter-head">Price
        <svg class="ic" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
      </div>
      <div class="filter-body">
        <div class="price-row">
          <input id="pmin" type="number" placeholder="Min">
          <input id="pmax" type="number" placeholder="Max">
        </div>
      </div>
    </div>
  </aside>

  <!-- CONTENT -->
  <main>
    <div class="topbar">
      <h1>All Products</h1>
      <div class="sort">sort :
        <select id="sort">
          <option value="recent">Recent</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
          <option value="az">Name: A-Z</option>
        </select>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<script>
  /* ---- Ikon placeholder produk (ganti dengan <img src="..."> milik Anda) ---- */
  const ICONS = {
    necklace:`<svg viewBox="0 0 100 100"><path d="M10 5 Q40 40 50 55" stroke="#aaa" stroke-width="2" fill="none" stroke-dasharray="2 1"/><circle cx="58" cy="65" r="18" fill="#bbb" stroke="#888" stroke-width="2"/><circle cx="58" cy="65" r="8" fill="#999"/></svg>`,
    ring:`<svg viewBox="0 0 100 100"><ellipse cx="50" cy="55" rx="26" ry="14" fill="none" stroke="#c9a227" stroke-width="7"/><rect x="34" y="32" width="26" height="18" rx="3" fill="#d4af37"/></svg>`,
    shorts:`<svg viewBox="0 0 100 100"><path d="M22 20 H78 L84 80 H54 L50 52 L46 80 H16 Z" fill="#111"/><rect x="22" y="20" width="56" height="6" fill="#222"/></svg>`,
    tee:`<svg viewBox="0 0 100 100"><path d="M30 18 L10 30 L18 44 L28 38 V82 H72 V38 L82 44 L90 30 L70 18 Q50 32 30 18Z" fill="#111"/><rect x="45" y="30" width="10" height="5" fill="#c00"/></svg>`
  };

  const PRODUCTS = [
    {id:1,name:"L&C Necklace",price:289474,icon:"necklace",stock:true, cat:"Classics 23",featured:true},
    {id:2,name:"L&C Ring",price:289474,icon:"ring",stock:true, cat:"Classics 23",featured:false},
    {id:3,name:"Shine Short Pants",price:442105,icon:"shorts",stock:true,low:true, cat:"Colorway 24",featured:true},
    {id:4,name:"Brigade Tee Black",price:352000,icon:"tee",stock:true,low:true, cat:"Brigade 24",featured:false},
    {id:5,name:"Moskva Tee",price:352000,icon:"tee",stock:true,low:true, cat:"Moskva 24",featured:true},
    {id:6,name:"Block Tee",price:368000,icon:"tee",stock:false,low:true, cat:"Back To Block 25",featured:false}
  ];

  const $ = s => document.querySelector(s);
  const rp = n => "Rp " + n.toLocaleString("en-US");

  function render(){
    const q = $("#q").value.trim().toLowerCase();
    const cats = [...document.querySelectorAll('input[name=cat]:checked')].map(i=>i.value);
    const ptype = document.querySelector('input[name=ptype]:checked').value;
    const avail = document.querySelector('input[name=avail]:checked').value;
    const min = parseFloat($("#pmin").value) || 0;
    const max = parseFloat($("#pmax").value) || Infinity;

    let list = PRODUCTS.filter(p =>
      p.name.toLowerCase().includes(q) &&
      (!cats.length || cats.includes(p.cat)) &&
      (ptype === "all" || p.featured) &&
      (avail === "all" || p.stock) &&
      p.price >= min && p.price <= max
    );

    const s = $("#sort").value;
    if (s === "low")  list.sort((a,b)=>a.price-b.price);
    if (s === "high") list.sort((a,b)=>b.price-a.price);
    if (s === "az")   list.sort((a,b)=>a.name.localeCompare(b.name));

    $("#grid").innerHTML = list.length ? list.map(p => `
      <a class="card" href="#">
        <div class="img">
          ${p.low ? '<span class="badge">Low Stock</span>' : ''}
          ${ICONS[p.icon]}
        </div>
        <div class="info">
          <div class="name">${p.name}</div>
          <div>${rp(p.price)}</div>
        </div>
      </a>`).join("") : '<div class="empty">Produk tidak ditemukan</div>';
  }

  /* collapse/expand filter */
  document.querySelectorAll(".filter-head").forEach(h =>
    h.addEventListener("click", () => h.parentElement.classList.toggle("closed")));

  /* listeners */
  ["#q","#pmin","#pmax","#sort"].forEach(s => $(s).addEventListener("input", render));
  document.querySelectorAll("aside input[type=checkbox], aside input[type=radio]")
    .forEach(i => i.addEventListener("change", render));

  render();
</script>
</body>
</html>
