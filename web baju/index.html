<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f3a" />
    <meta name="description" content="NPD CLUB — premium streetwear made for everyday life." />
    <title>NPD CLUB — Modern Streetwear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --navy: #0b1f3a;
        --navy-2: #17385d;
        --ink: #111827;
        --muted: #667085;
        --line: #e6e9ee;
        --soft: #f2f4f7;
        --white: #fff;
        --radius: 18px;
        font-family: "DM Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; min-width: 320px; background: var(--white); color: var(--ink); }
      button, input, select, textarea { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }
      button { color: inherit; }
      a { color: inherit; text-decoration: none; }
      img { display: block; max-width: 100%; }
      .shell { width: min(1320px, calc(100% - 44px)); margin: 0 auto; }
      .announcement { padding: 9px 16px; background: var(--navy); color: #fff; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      .header { position: sticky; z-index: 20; top: 0; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.94); backdrop-filter: blur(16px); }
      .header-row { min-height: 76px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; }
      .wordmark { justify-self: center; font-size: 22px; font-weight: 800; letter-spacing: .16em; color: var(--navy); white-space: nowrap; }
      .header-note { color: var(--muted); font-size: 12px; font-weight: 600; }
      .header-link { justify-self: end; border: 0; background: none; color: var(--navy); font-size: 12px; font-weight: 700; cursor: pointer; }
      .hero { position: relative; display: flex; min-height: 510px; align-items: end; overflow: hidden; background: #d9e0e5; }
      .hero-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 38%; }
      .hero::after { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,17,34,.76), rgba(5,17,34,.25) 55%, rgba(5,17,34,.05)), linear-gradient(0deg, rgba(5,17,34,.28), transparent 55%); content: ""; }
      .hero-content { position: relative; z-index: 1; width: min(1320px, calc(100% - 44px)); margin: 0 auto; padding: 64px 0 62px; color: white; }
      .eyebrow { margin: 0 0 16px; font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
      .hero h1 { max-width: 650px; margin: 0; font-size: clamp(44px, 8vw, 88px); font-weight: 700; letter-spacing: -.065em; line-height: .96; }
      .hero-copy { max-width: 460px; margin: 20px 0 27px; color: rgba(255,255,255,.83); font-size: 15px; line-height: 1.7; }
      .button { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; gap: 9px; border: 1px solid transparent; border-radius: 999px; padding: 0 21px; background: var(--navy); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; transition: background .2s, transform .2s, border-color .2s; }
      .button:hover { transform: translateY(-1px); background: var(--navy-2); }
      .button:disabled { transform: none; background: #aab2bd; cursor: not-allowed; }
      .button-outline { border-color: var(--line); background: #fff; color: var(--navy); }
      .button-outline:hover { border-color: var(--navy); background: #fff; }
      .button-light { background: white; color: var(--navy); }
      .button-light:hover { background: #f1f3f6; }
      .section { padding: 72px 0 22px; }
      .section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
      .section-title { margin: 0; color: var(--navy); font-size: clamp(26px, 4vw, 38px); letter-spacing: -.055em; line-height: 1.12; }
      .section-subtitle { max-width: 480px; margin: 9px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
      .text-button { border: 0; padding: 8px 0; background: none; color: var(--navy); font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
      .collection-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
      .collection-tile { position: relative; display: flex; min-height: 300px; align-items: end; overflow: hidden; border-radius: var(--radius); background: var(--soft); color: #fff; text-align: left; cursor: pointer; }
      .collection-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
      .collection-tile:hover img { transform: scale(1.045); }
      .collection-tile::after { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(4,17,35,.76), transparent 68%); content: ""; }
      .collection-tile-copy { position: relative; z-index: 1; padding: 22px; }
      .collection-tile-copy span { display: block; margin-bottom: 4px; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      .collection-tile-copy strong { font-size: 23px; letter-spacing: -.04em; }
      .catalog { padding-top: 76px; }
      .catalog-controls { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
      .product-count { color: var(--muted); font-size: 12px; }
      .product-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 30px 16px; }
      .product-card { min-width: 0; }
      .product-photo-wrap { position: relative; overflow: hidden; border-radius: 12px; background: var(--soft); }
      .product-photo { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; cursor: pointer; transition: transform .45s, filter .3s; }
      .product-card:hover .product-photo { transform: scale(1.025); }
      .product-card.is-sold .product-photo { filter: grayscale(1); opacity: .58; }
      .sold-badge { position: absolute; top: 12px; left: 12px; border-radius: 3px; padding: 7px 9px; background: var(--navy); color: white; font-size: 9px; font-weight: 800; letter-spacing: .1em; }
      .heart-button { position: absolute; top: 10px; right: 10px; display: grid; width: 38px; height: 38px; place-items: center; border: 0; border-radius: 50%; background: rgba(255,255,255,.92); color: var(--navy); cursor: pointer; }
      .heart-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; }
      .heart-button.active svg { fill: #b42335; stroke: #b42335; }
      .quick-add { position: absolute; right: 10px; bottom: 10px; left: 10px; min-height: 41px; border: 0; border-radius: 6px; background: rgba(255,255,255,.95); color: var(--navy); font-size: 11px; font-weight: 700; cursor: pointer; }
      .quick-add:hover:not(:disabled) { background: var(--navy); color: white; }
      .quick-add:disabled { color: #7a8492; cursor: not-allowed; }
      .product-meta { display: flex; align-items: start; justify-content: space-between; gap: 12px; padding-top: 12px; }
      .product-title { margin: 0; overflow: hidden; color: var(--navy); font-size: 13px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
      .product-collection { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
      .product-price { color: var(--navy); font-size: 12px; font-weight: 700; white-space: nowrap; }
      .empty-state { grid-column: 1 / -1; padding: 56px 18px; border: 1px dashed #cbd2dc; border-radius: 14px; color: var(--muted); text-align: center; }
      .empty-state h3 { margin: 0 0 8px; color: var(--navy); }
      .footer { margin-top: 76px; padding: 42px 0 110px; background: var(--navy); color: white; }
      .footer-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
      .footer-brand { font-size: 18px; font-weight: 800; letter-spacing: .14em; }
      .footer-note { margin: 7px 0 0; color: rgba(255,255,255,.7); font-size: 11px; }
      .footer-links { display: flex; gap: 22px; color: rgba(255,255,255,.84); font-size: 11px; }

      .bottom-nav { position: fixed; z-index: 30; right: 0; bottom: 0; left: 0; display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px max(14px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); border-top: 1px solid var(--line); background: rgba(255,255,255,.97); backdrop-filter: blur(18px); }
      .nav-action { position: relative; display: flex; min-height: 54px; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; background: transparent; color: #657185; font-size: 9px; font-weight: 700; cursor: pointer; }
      .nav-action svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
      .nav-action.active { color: var(--navy); }
      .nav-action.menu-main { color: var(--navy); }
      .nav-count { position: absolute; top: 1px; left: calc(50% + 6px); display: grid; min-width: 17px; height: 17px; place-items: center; border-radius: 50%; padding: 0 4px; background: var(--navy); color: white; font-size: 9px; }
      .backdrop { position: fixed; z-index: 39; inset: 0; visibility: hidden; background: rgba(9,20,37,.45); opacity: 0; transition: opacity .25s, visibility .25s; }
      .backdrop.open { visibility: visible; opacity: 1; }
      .drawer { position: fixed; z-index: 40; right: 0; bottom: 0; left: 0; max-height: min(82vh, 700px); overflow: auto; transform: translateY(105%); border-radius: 24px 24px 0 0; padding: 10px 22px calc(88px + env(safe-area-inset-bottom)); background: white; transition: transform .28s ease; }
      .drawer.open { transform: translateY(0); }
      .drawer-handle { width: 38px; height: 4px; margin: 0 auto 18px; border-radius: 9px; background: #d5dae2; }
      .drawer-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
      .drawer-head h2 { margin: 0; color: var(--navy); font-size: 18px; }
      .icon-button { display: grid; width: 38px; height: 38px; place-items: center; border: 0; border-radius: 50%; background: var(--soft); color: var(--navy); cursor: pointer; }
      .drawer-group { padding: 17px 0; border-bottom: 1px solid var(--line); }
      .drawer-group-toggle, .drawer-link { display: flex; width: 100%; align-items: center; justify-content: space-between; border: 0; padding: 9px 0; background: none; color: var(--navy); text-align: left; font-size: 14px; font-weight: 700; cursor: pointer; }
      .drawer-submenu { display: none; padding: 4px 0 0 14px; }
      .drawer-submenu.open { display: block; }
      .drawer-submenu button { display: block; width: 100%; border: 0; padding: 10px 0; background: none; color: var(--muted); text-align: left; font-size: 13px; cursor: pointer; }
      .drawer-submenu button:hover, .drawer-link:hover { color: var(--navy-2); }
      .chevron { transition: transform .2s; }
      .chevron.rotate { transform: rotate(180deg); }

      .page { min-height: 68vh; padding: 38px 0 30px; }
      .page-header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
      .page-header h1 { margin: 0; color: var(--navy); font-size: clamp(25px, 4vw, 36px); letter-spacing: -.05em; }
      .back-button { display: grid; width: 40px; height: 40px; flex: 0 0 auto; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: white; color: var(--navy); cursor: pointer; }
      .detail-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(300px, .9fr); gap: clamp(28px, 7vw, 90px); }
      .gallery-main { overflow: hidden; border-radius: 14px; background: var(--soft); }
      .gallery-main img { width: 100%; max-height: 720px; aspect-ratio: 4 / 5; object-fit: cover; }
      .gallery-thumbs { display: flex; gap: 10px; margin-top: 10px; }
      .gallery-thumbs button { width: 64px; overflow: hidden; border: 1px solid transparent; border-radius: 7px; padding: 0; background: var(--soft); cursor: pointer; }
      .gallery-thumbs button.selected { border-color: var(--navy); }
      .gallery-thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; }
      .detail-copy { align-self: center; }
      .detail-copy h1 { margin: 8px 0; color: var(--navy); font-size: clamp(30px, 4vw, 44px); letter-spacing: -.055em; line-height: 1.04; }
      .detail-price { margin: 0 0 22px; color: var(--navy); font-size: 16px; font-weight: 700; }
      .detail-description { color: var(--muted); font-size: 13px; line-height: 1.8; }
      .option-block { margin-top: 23px; }
      .option-label { display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--navy); font-size: 12px; font-weight: 700; }
      .option-list { display: flex; flex-wrap: wrap; gap: 8px; }
      .option-chip { min-width: 46px; min-height: 40px; border: 1px solid #d5dae2; border-radius: 5px; padding: 0 11px; background: white; color: var(--navy); font-size: 11px; cursor: pointer; }
      .option-chip.selected { border-color: var(--navy); background: var(--navy); color: white; }
      .option-chip.unavailable { color: #aeb5bf; text-decoration: line-through; cursor: not-allowed; }
      .color-chip { min-width: 80px; }
      .stock-message { margin: 12px 0 0; color: var(--muted); font-size: 11px; }
      .detail-actions { display: flex; gap: 10px; margin-top: 24px; }
      .detail-actions .button { flex: 1; }
      .detail-heart { width: 48px; height: 48px; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 50%; background: white; color: #b42335; cursor: pointer; }
      .detail-heart svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; vertical-align: middle; }
      .detail-heart.active svg { fill: #b42335; }
      .info-strip { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }

      .content-card { border: 1px solid var(--line); border-radius: 14px; padding: 22px; background: white; }
      .cart-layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(260px, .7fr); align-items: start; gap: 24px; }
      .cart-list { display: grid; gap: 12px; }
      .cart-item { display: grid; grid-template-columns: 92px 1fr auto; gap: 16px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
      .cart-item img { width: 92px; aspect-ratio: 4/5; border-radius: 8px; object-fit: cover; cursor: pointer; }
      .cart-item h3 { margin: 0; color: var(--navy); font-size: 14px; cursor: pointer; }
      .cart-item p { margin: 5px 0; color: var(--muted); font-size: 11px; }
      .quantity { display: inline-flex; align-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; }
      .quantity button { width: 30px; height: 30px; border: 0; background: white; color: var(--navy); cursor: pointer; }
      .quantity span { min-width: 27px; text-align: center; font-size: 11px; }
      .remove-button { display: block; margin-top: 7px; border: 0; padding: 0; background: none; color: var(--muted); font-size: 10px; text-decoration: underline; cursor: pointer; }
      .summary-card { position: sticky; top: 98px; }
      .summary-card h2 { margin: 0 0 18px; color: var(--navy); font-size: 18px; }
      .summary-row { display: flex; justify-content: space-between; gap: 12px; margin: 12px 0; color: var(--muted); font-size: 12px; }
      .summary-total { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--navy); font-size: 14px; font-weight: 800; }
      .summary-card .button { width: 100%; margin-top: 16px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .field { display: grid; gap: 7px; }
      .field.full { grid-column: 1 / -1; }
      .field label { color: var(--navy); font-size: 11px; font-weight: 700; }
      .field input, .field textarea, .field select { width: 100%; min-height: 44px; border: 1px solid #d7dce4; border-radius: 7px; outline: none; padding: 11px 12px; background: white; color: var(--ink); font-size: 12px; }
      .field textarea { min-height: 84px; resize: vertical; }
      .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(11,31,58,.08); }
      .payment-options { display: grid; gap: 9px; margin-top: 12px; }
      .payment-option { display: flex; align-items: center; gap: 11px; border: 1px solid var(--line); border-radius: 8px; padding: 13px; cursor: pointer; }
      .payment-option:has(input:checked) { border-color: var(--navy); background: #f7f9fc; }
      .payment-option input { accent-color: var(--navy); }
      .payment-option span { color: var(--navy); font-size: 12px; font-weight: 700; }
      .auth-wrap { width: min(470px, 100%); margin: 0 auto; }
      .auth-tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
      .auth-tab { border: 0; border-bottom: 2px solid transparent; padding: 12px 0; background: none; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; }
      .auth-tab.selected { border-color: var(--navy); color: var(--navy); }
      .inline-link { border: 0; padding: 0; background: none; color: var(--navy); font-size: 11px; font-weight: 700; text-decoration: underline; cursor: pointer; }
      .notice { margin: 12px 0 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
      .payment-box { width: min(540px, 100%); margin: 0 auto; text-align: center; }
      .payment-box h2 { margin: 0 0 8px; color: var(--navy); }
      .qr-mock { display: grid; width: 180px; height: 180px; place-items: center; margin: 20px auto; border: 8px solid white; outline: 1px solid var(--line); background: repeating-conic-gradient(#101820 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
      .qr-mock span { padding: 6px; background: white; color: var(--navy); font-size: 10px; font-weight: 800; }
      .code-box { margin: 15px 0; border-radius: 7px; padding: 15px; background: var(--soft); color: var(--navy); font-size: 19px; font-weight: 800; letter-spacing: .1em; }
      .countdown { margin: 12px 0; color: #a33a2f; font-size: 13px; font-weight: 700; }
      .order-status { display: inline-flex; border-radius: 999px; padding: 7px 11px; background: #fff2d6; color: #805b00; font-size: 10px; font-weight: 800; text-transform: uppercase; }
      .order-status.paid { background: #dcfce7; color: #166534; }
      .account-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
      .toast { position: fixed; z-index: 60; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); max-width: calc(100vw - 32px); transform: translateY(14px); border-radius: 9px; padding: 13px 17px; background: var(--navy); color: white; font-size: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
      .toast.show { transform: translateY(0); opacity: 1; }
      .hidden { display: none !important; }
      .demo-banner { margin: 18px 0; border: 1px solid #ead9a5; border-radius: 8px; padding: 11px 13px; background: #fff9e9; color: #634e12; font-size: 11px; line-height: 1.6; }

      @media (min-width: 900px) { .drawer { right: 24px; bottom: 78px; left: auto; width: 380px; border-radius: 20px; padding-bottom: 22px; } .drawer-handle { display: none; } }
      @media (max-width: 860px) { .product-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 12px; } .collection-tile { min-height: 250px; } .detail-layout { gap: 28px; } }
      @media (max-width: 620px) {
        .shell { width: min(100% - 28px, 500px); }
        .header-row { min-height: 62px; grid-template-columns: 1fr auto 1fr; gap: 8px; }
        .wordmark { font-size: 17px; letter-spacing: .13em; }
        .header-note { max-width: 72px; font-size: 9px; line-height: 1.3; }
        .header-link { font-size: 10px; }
        .announcement { font-size: 9px; }
        .hero { min-height: 550px; min-height: min(72svh, 660px); }
        .hero-image { object-position: 58% center; }
        .hero-content { width: calc(100% - 36px); padding: 45px 0 38px; }
        .hero h1 { font-size: clamp(48px, 14vw, 72px); }
        .hero-copy { max-width: 320px; font-size: 13px; }
        .section { padding-top: 50px; }
        .section-head { align-items: start; }
        .section-subtitle { font-size: 12px; }
        .collection-grid { grid-template-columns: 1fr; gap: 10px; }
        .collection-tile { min-height: 200px; }
        .catalog { padding-top: 48px; }
        .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 10px; }
        .product-title { font-size: 11px; }
        .product-price { font-size: 11px; }
        .product-meta { gap: 5px; }
        .quick-add { min-height: 37px; font-size: 10px; }
        .sold-badge { top: 8px; left: 8px; padding: 6px 7px; font-size: 8px; }
        .heart-button { top: 7px; right: 7px; width: 34px; height: 34px; }
        .footer { margin-top: 50px; padding: 30px 0 98px; }
        .footer-row { align-items: start; flex-direction: column; }
        .footer-links { gap: 16px; }
        .page { padding-top: 25px; }
        .detail-layout { grid-template-columns: 1fr; gap: 23px; }
        .gallery-main img { max-height: 560px; }
        .detail-copy h1 { font-size: 34px; }
        .cart-layout { grid-template-columns: 1fr; }
        .summary-card { position: static; }
        .cart-item { grid-template-columns: 74px 1fr auto; gap: 10px; padding: 9px; }
        .cart-item img { width: 74px; }
        .cart-item h3 { font-size: 12px; }
        .form-grid { grid-template-columns: 1fr; }
        .field.full { grid-column: auto; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div class="announcement">Complimentary delivery on orders over Rp 750.000</div>
    <header class="header">
      <div class="shell header-row">
        <span class="header-note">Modern essentials<br />Made for everyday</span>
        <a class="wordmark" href="#" data-action="home" aria-label="NPD CLUB home">NPD CLUB</a>
        <button class="header-link" type="button" data-action="open-menu">EXPLORE&nbsp; ↗</button>
      </div>
    </header>
    <main id="app"></main>
    <footer class="footer">
      <div class="shell footer-row">
        <div><div class="footer-brand">NPD CLUB</div><p class="footer-note">Modern essentials. Made for everyday.</p></div>

          <button type="button" data-action="collection" data-collection="Winter Collection">Winter Collection</button>

      <div class="drawer-group"><button class="drawer-link" type="button" data-action="wishlist">Wishlist <span>♡</span></button></div>
      <div class="drawer-group"><button class="drawer-link" type="button" data-action="cart">Cart <span>→</span></button></div>

      <button class="nav-action" type="button" data-action="wishlist">
        <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg>Wishlist<span class="nav-count hidden" id="wishlist-count">0</span>

      <button class="nav-action" type="button" data-action="cart">

      </button>
    </nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      (() => {
        const collections = ["NPD Collection", "Spring Collection", "Winter Collection"];
        const productNames = {
          "NPD Collection": ["Studio Heavy Tee", "Club Logo Hoodie", "Everyday Cargo", "Core Relaxed Shirt", "Utility Overshirt", "NPD Track Pants"],
          "Spring Collection": ["Daybreak Cotton Tee", "Spring Coach Jacket", "Easy Pleat Trousers", "Washed Canvas Cap", "Coastal Knit Polo", "Lightweight Windbreaker"],
          "Winter Collection": ["Alpine Puffer Jacket", "Thermal Base Layer", "Northside Fleece", "Ribbed Wool Beanie", "Winter Cargo Pants", "Quilted Club Vest"]
        };
        const photoIds = [
          "photo-1523398002811-999ca8dec234", "photo-1551488831-00ddcb6c6bd3", "photo-1521572163474-6864f9cf17ab",
          "photo-1551028719-00167b16eac5", "photo-1515886657613-9f3515b0c78f", "photo-1529139574466-a303027c1d8b",
          "photo-1551488831-00ddcb6c6bd3", "photo-1523398002811-999ca8dec234", "photo-1521572163474-6864f9cf17ab",
          "photo-1515886657613-9f3515b0c78f", "photo-1551028719-00167b16eac5", "photo-1529139574466-a303027c1d8b",
          "photo-1551488831-00ddcb6c6bd3", "photo-1523398002811-999ca8dec234", "photo-1521572163474-6864f9cf17ab",
          "photo-1551028719-00167b16eac5", "photo-1515886657613-9f3515b0c78f", "photo-1529139574466-a303027c1d8b"
        ];
        const sizes = ["S", "M", "L", "XL"];
        const colors = ["Black", "Off-white", "Navy"];
        const money = (value) => new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(value);
        const products = collections.flatMap((collection, collectionIndex) =>
          productNames[collection].map((name, itemIndex) => {
            const id = `${collectionIndex + 1}-${itemIndex + 1}`;
            const soldOut = id === "1-6" || id === "2-4" || id === "3-2";
            const base = collectionIndex === 2 ? 799000 : collectionIndex === 1 ? 499000 : 549000;
            const variants = {};
            sizes.forEach((size, sizeIndex) => colors.forEach((color, colorIndex) => {
              variants[`${size}|${color}`] = soldOut ? 0 : (itemIndex === 2 && sizeIndex === 3 ? 0 : 2 + ((itemIndex + sizeIndex + colorIndex) % 7));
            }));
            const photo = `https://images.unsplash.com/${photoIds[collectionIndex * 6 + itemIndex]}?auto=format&fit=crop&w=1000&q=85`;
            return { id, name, collection, price: base + itemIndex * 45000, photo, variants, description: `${name} by NPD CLUB. Designed with considered details, an easy everyday fit, and durable fabric chosen for regular wear.` };
          })
        );
        const storage = {
          read(key, fallback) {
            try { const data = localStorage.getItem(`npd-${key}`); return data ? JSON.parse(data) : fallback; }
            catch (error) { console.error(`Unable to read ${key} from local storage.`, error); return fallback; }
          },
          write(key, value) {
            try { localStorage.setItem(`npd-${key}`, JSON.stringify(value)); }
            catch (error) { console.error(`Unable to save ${key} to local storage.`, error); toast("Could not save your changes on this device."); }
          }
        };
        const state = {
          page: "home",
          collection: "All",
          selectedProduct: null,
          selectedSize: "M",
          selectedColor: "Black",
          galleryIndex: 0,
          authTab: "login",
          menuOpen: false,
          wishlist: storage.read("wishlist", []),
          cart: storage.read("cart", []),
          stock: storage.read("stock", null),
          user: storage.read("user", null),
          orders: storage.read("orders", []),
          pendingWishlist: null,
          orderId: null
        };
        if (!state.stock) {
          state.stock = Object.fromEntries(products.map((product) => [product.id, product.variants]));
          storage.write("stock", state.stock);
        }
        const app = document.getElementById("app");
        const drawer = document.getElementById("drawer");
        const backdrop = document.getElementById("backdrop");
        const wishlistCount = document.getElementById("wishlist-count");
        const cartCount = document.getElementById("cart-count");
        const toastEl = document.getElementById("toast");
        let toastTimer;

        function toast(message) {
          toastEl.textContent = message;
          toastEl.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
        }
        function save(key) {
          storage.write(key, state[key]);
          updateCounts();
        }
        function getProduct(id) { return products.find((product) => product.id === id); }
        function getStock(product, size, color) {
          return Number(state.stock?.[product.id]?.[`${size}|${color}`] ?? 0);
        }
        function totalStock(product) {
          return Object.values(state.stock?.[product.id] || {}).reduce((total, amount) => total + Number(amount), 0);
        }
        function isSoldOut(product) { return totalStock(product) === 0; }
        function updateCounts() {
          wishlistCount.textContent = state.wishlist.length;
          wishlistCount.classList.toggle("hidden", !state.wishlist.length);
          cartCount.textContent = state.cart.reduce((total, item) => total + item.quantity, 0);
          cartCount.classList.toggle("hidden", !state.cart.length);
        }
        function iconHeart() {
          return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg>';
        }
        function productCard(product) {
          const sold = isSoldOut(product);
          const liked = state.wishlist.includes(product.id);
          return `<article class="product-card ${sold ? "is-sold" : ""}">
            <div class="product-photo-wrap">
              <img class="product-photo" src="${product.photo}" alt="${product.name}" loading="lazy" data-action="detail" data-id="${product.id}">
              ${sold ? '<span class="sold-badge">SOLD OUT</span>' : ""}
              <button class="heart-button ${liked ? "active" : ""}" type="button" data-action="wishlist-toggle" data-id="${product.id}" aria-label="${liked ? "Remove from" : "Add to"} wishlist">${iconHeart()}</button>
              <button class="quick-add" type="button" data-action="${sold ? "" : "quick-add"}" data-id="${product.id}" ${sold ? "disabled" : ""}>${sold ? "Sold Out" : "Add to Cart"}</button>
            </div>
            <div class="product-meta">
              <div><h3 class="product-title" data-action="detail" data-id="${product.id}">${product.name}</h3><p class="product-collection">${product.collection}</p></div>
              <span class="product-price">${money(product.price)}</span>
            </div>
          </article>`;
        }
        function renderHome() {
          const list = state.collection === "All" ? products : products.filter((product) => product.collection === state.collection);
          const heading = state.collection === "All" ? "The latest from NPD CLUB" : state.collection;
          app.innerHTML = `<section class="hero">
              <img class="hero-image" src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=2200&q=90" alt="NPD CLUB modern streetwear collection">
              <div class="hero-content"><p class="eyebrow">NPD CLUB — New season, same standards</p><h1>Wear your<br>own pace.</h1><p class="hero-copy">Considered streetwear. Everyday comfort. Pieces designed to move with you, wherever the day goes.</p><button class="button button-light" type="button" data-action="collection" data-collection="NPD Collection">Explore the collection&nbsp; →</button></div>
            </section>
            <section class="section shell" id="collections">
              <div class="section-head"><div><p class="eyebrow" style="color:var(--muted)">Shop by collection</p><h2 class="section-title">Find your uniform.</h2><p class="section-subtitle">Three edits. One point of view. Explore what feels right for right now.</p></div></div>
              <div class="collection-grid">${collections.map((collection, index) => {
                const image = products[index * 6].photo;
                return `<button class="collection-tile" type="button" data-action="collection" data-collection="${collection}"><img src="${image}" alt="" loading="lazy"><span class="collection-tile-copy"><span>Explore the edit</span><strong>${collection}</strong></span></button>`;
              }).join("")}</div>
            </section>
            <section class="section shell catalog" id="products">
              <div class="section-head"><div><p class="eyebrow" style="color:var(--muted)">Made for the everyday</p><h2 class="section-title">${heading}</h2><p class="section-subtitle">Thoughtful fits, quality fabrics, and the details you reach for again and again.</p></div><button class="text-button" type="button" data-action="open-menu">VIEW COLLECTIONS&nbsp; ↗</button></div>
              <div class="catalog-controls"><span class="product-count">${list.length} pieces</span><span class="product-count">Prices shown in IDR</span></div>
              <div class="product-grid">${list.map(productCard).join("")}</div>
            </section>`;
          updateCounts();
        }
        function renderProduct(product) {
          state.selectedProduct = product.id;
          state.page = "detail";
          state.selectedSize = "M";
          state.selectedColor = "Black";
          state.galleryIndex = 0;
          const key = `${state.selectedSize}|${state.selectedColor}`;
          app.innerHTML = `<section class="page shell">
            <div class="page-header"><button class="back-button" type="button" data-action="back" aria-label="Back">←</button><h1>Product details</h1></div>
            <div class="detail-layout">
              <div><div class="gallery-main"><img id="detail-image" src="${product.photo}" alt="${product.name}"></div><div class="gallery-thumbs">
                <button class="selected" type="button" data-action="gallery" data-index="0"><img src="${product.photo}" alt="${product.name} front view"></button>
                <button type="button" data-action="gallery" data-index="1"><img src="https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=700&q=80" alt="${product.name} detail view"></button>
                <button type="button" data-action="gallery" data-index="2"><img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=700&q=80" alt="${product.name} alternate view"></button>
              </div></div>
              <div class="detail-copy">
                <p class="eyebrow" style="color:var(--muted)">${product.collection}</p><h1>${product.name}</h1><p class="detail-price">${money(product.price)}</p>
                <p class="detail-description">${product.description} Built with a relaxed, considered silhouette for a comfortable fit. Easy to layer and made to be worn on repeat.</p>
                <div class="option-block"><div class="option-label"><span>Size</span><span>Size guide</span></div><div class="option-list">${sizes.map((size) => {
                  const available = colors.some((color) => getStock(product, size, color) > 0);
                  return `<button class="option-chip ${size === state.selectedSize ? "selected" : ""} ${available ? "" : "unavailable"}" type="button" data-action="size" data-size="${size}" ${available ? "" : "disabled"}>${size}</button>`;
                }).join("")}</div></div>
                <div class="option-block"><div class="option-label"><span>Color</span><span id="color-label">${state.selectedColor}</span></div><div class="option-list">${colors.map((color) => `<button class="option-chip color-chip ${color === state.selectedColor ? "selected" : ""} ${getStock(product, state.selectedSize, color) > 0 ? "" : "unavailable"}" type="button" data-action="color" data-color="${color}" ${getStock(product, state.selectedSize, color) > 0 ? "" : "disabled"}>${color}</button>`).join("")}</div></div>
                <p class="stock-message" id="stock-message">${isSoldOut(product) ? "Sold out in all sizes and colors." : `${getStock(product, state.selectedSize, state.selectedColor)} in stock for selected size and color.`}</p>
                <div class="detail-actions"><button class="button" id="detail-add" type="button" data-action="detail-add" data-id="${product.id}" ${isSoldOut(product) || !getStock(product, state.selectedSize, state.selectedColor) ? "disabled" : ""}>${isSoldOut(product) ? "Sold Out" : "Add to Cart"}</button><button class="detail-heart ${state.wishlist.includes(product.id) ? "active" : ""}" type="button" data-action="wishlist-toggle" data-id="${product.id}" aria-label="Toggle wishlist">${iconHeart()}</button></div>
                <div class="info-strip"><span>✓ Secure checkout</span><span>↗ Easy 30-day returns</span><span>□ Complimentary delivery over Rp 750.000</span></div>
              </div>
            </div>
          </section>`;
          updateCounts();
        }
        function renderWishlist() {
          if (!state.user) { state.pendingWishlist = null; showAuth("login", "wishlist"); return; }
          state.page = "wishlist";
          const list = state.wishlist.map(getProduct).filter(Boolean);
          app.innerHTML = `<section class="page shell"><div class="page-header"><button class="back-button" type="button" data-action="back">←</button><h1>Your wishlist</h1></div>
            <p class="section-subtitle" style="margin:-16px 0 24px">Pieces you have your eye on.</p>
            <div class="product-grid">${list.length ? list.map((product) => `${productCard(product)}<span class="hidden"></span>`).join("") : '<div class="empty-state"><h3>Your wishlist is waiting</h3><p>Save your favorite pieces here and come back anytime.</p><button class="button" type="button" data-action="home">Discover the collection</button></div>'}</div>
          </section>`;
          updateCounts();
        }
        function addCart(product, size, color, quantity = 1) {
          if (!product || isSoldOut(product)) { toast("This piece is sold out."); return; }
          const available = getStock(product, size, color);
          if (available < quantity) { toast("Not enough stock for this size and color."); return; }
          const existing = state.cart.find((item) => item.id === product.id && item.size === size && item.color === color);
          if (existing) {
            if (existing.quantity + quantity > available) { toast("You have added all available stock."); return; }
            existing.quantity += quantity;
          } else {
            state.cart.push({ id: product.id, size, color, quantity });
          }
          save("cart");
          toast(`${product.name} added to cart.`);
        }
        function renderCart() {
          state.page = "cart";
          const subtotal = state.cart.reduce((total, item) => total + (getProduct(item.id)?.price || 0) * item.quantity, 0);
          app.innerHTML = `<section class="page shell"><div class="page-header"><button class="back-button" type="button" data-action="back">←</button><h1>Your cart</h1></div>
            ${state.cart.length ? `<div class="cart-layout"><div class="cart-list">${state.cart.map((item, index) => {
              const product = getProduct(item.id);
              return `<article class="cart-item"><img src="${product.photo}" alt="${product.name}" data-action="detail" data-id="${product.id}"><div><h3 data-action="detail" data-id="${product.id}">${product.name}</h3><p>${item.color} · Size ${item.size}</p><strong class="product-price">${money(product.price * item.quantity)}</strong><button class="remove-button" type="button" data-action="remove-cart" data-index="${index}">Remove</button></div><div class="quantity"><button type="button" data-action="quantity" data-index="${index}" data-delta="-1" aria-label="Decrease quantity">−</button><span>${item.quantity}</span><button type="button" data-action="quantity" data-index="${index}" data-delta="1" aria-label="Increase quantity">+</button></div></article>`;
            }).join("")}</div><aside class="content-card summary-card"><h2>Order summary</h2><div class="summary-row"><span>Subtotal</span><strong>${money(subtotal)}</strong></div><div class="summary-row"><span>Shipping</span><span>Calculated at checkout</span></div><div class="summary-row summary-total"><span>Total</span><span>${money(subtotal)}</span></div><button class="button" type="button" data-action="checkout">Continue to checkout</button><p class="notice">Shipping charges are calculated when you provide your delivery address.</p></aside></div>` : '<div class="empty-state"><h3>Your cart is empty</h3><p>Start with a piece you will wear on repeat.</p><button class="button" type="button" data-action="home">Shop the collection</button></div>'}
          </section>`;
          updateCounts();
        }
        function renderCheckout() {
          if (!state.user) { showAuth("login", "checkout"); return; }
          if (!state.cart.length) { toast("Your cart is empty."); renderCart(); return; }
          state.page = "checkout";
          const subtotal = state.cart.reduce((total, item) => total + (getProduct(item.id)?.price || 0) * item.quantity, 0);
          app.innerHTML = `<section class="page shell"><div class="page-header"><button class="back-button" type="button" data-action="back">←</button><h1>Checkout</h1></div>
            <div class="cart-layout"><form id="checkout-form" class="content-card">
              <h2 style="margin:0 0 18px;color:var(--navy);font-size:18px">Shipping address</h2>
              <div class="form-grid">
                <div class="field"><label for="full-name">Full name</label><input id="full-name" name="name" autocomplete="name" required value="${state.user.name || ""}"></div>
                <div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" required pattern="[0-9+() -]{8,18}"></div>
                <div class="field full"><label for="address">Full address</label><textarea id="address" name="address" autocomplete="street-address" required></textarea></div>
                <div class="field"><label for="city">City</label><input id="city" name="city" autocomplete="address-level2" required></div>
                <div class="field"><label for="postal">Postal code</label><input id="postal" name="postal" autocomplete="postal-code" inputmode="numeric" pattern="[0-9]{5}" required></div>
              </div>
              <h2 style="margin:26px 0 8px;color:var(--navy);font-size:18px">Payment method</h2>
              <div class="payment-options">
                <label class="payment-option"><input type="radio" name="payment" value="QRIS" checked><span>QRIS · Scan to pay</span></label>
                <label class="payment-option"><input type="radio" name="payment" value="BCA"><span>Virtual Account · BCA</span></label>
                <label class="payment-option"><input type="radio" name="payment" value="BRI"><span>Virtual Account · BRI</span></label>
                <label class="payment-option"><input type="radio" name="payment" value="Mandiri"><span>Virtual Account · Mandiri</span></label>
                <label class="payment-option"><input type="radio" name="payment" value="BNI"><span>Virtual Account · BNI</span></label>
              </div>
              <p class="demo-banner">Demo checkout: payment options are simulated for this frontend preview. No payment will be collected.</p>
              <button class="button" type="submit" style="width:100%;margin-top:8px">Place order · ${money(subtotal)}</button>
            </form><aside class="content-card summary-card"><h2>Your order</h2>${state.cart.map((item) => { const product = getProduct(item.id); return `<div class="summary-row"><span>${product.name} · ${item.size} × ${item.quantity}</span><strong>${money(product.price * item.quantity)}</strong></div>`; }).join("")}<div class="summary-row summary-total"><span>Total</span><span>${money(subtotal)}</span></div></aside></div>
          </section>`;
          document.getElementById("checkout-form").addEventListener("submit", placeOrder);
        }
        function showAuth(tab = "login", destination = "account") {
          state.page = "auth";
          state.authTab = tab;
          state.authDestination = destination;
          renderAuth();
        }
        function renderAuth() {
          const register = state.authTab === "register";
          app.innerHTML = `<section class="page shell"><div class="page-header"><button class="back-button" type="button" data-action="back">←</button><h1>${register ? "Join the club" : "Welcome back"}</h1></div>
            <div class="auth-wrap content-card"><div class="auth-tabs"><button class="auth-tab ${register ? "" : "selected"}" type="button" data-action="auth-tab" data-tab="login">Login</button><button class="auth-tab ${register ? "selected" : ""}" type="button" data-action="auth-tab" data-tab="register">Create account</button></div>
              <form id="auth-form" class="form-grid">
                ${register ? '<div class="field full"><label for="auth-name">Name</label><input id="auth-name" name="name" autocomplete="name" required></div>' : ""}
                <div class="field full"><label for="auth-email">Email</label><input id="auth-email" name="email" type="email" autocomplete="email" required></div>
                ${register ? '<div class="field full"><label for="auth-phone">Phone number</label><input id="auth-phone" name="phone" type="tel" autocomplete="tel" required></div>' : ""}
                <div class="field full"><label for="auth-password">Password</label><input id="auth-password" name="password" type="password" autocomplete="${register ? "new-password" : "current-password"}" minlength="8" required></div>
                <div class="field full"><button class="button" type="submit">${register ? "Create account" : "Login"}</button></div>
              </form>
              ${register ? "" : '<p style="text-align:right"><button class="inline-link" type="button" data-action="forgot">Forgot password?</button></p>'}
              <p class="demo-banner">Demo account: this preview stores a basic signed-in profile on this device only. Do not enter a real password or personal information.</p>
            </div></section>`;
          document.getElementById("auth-form").addEventListener("submit", authenticate);
        }
        function authenticate(event) {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          const email = String(form.get("email") || "").trim();
          const name = String(form.get("name") || email.split("@")[0]).trim();
          if (!email || !String(form.get("password") || "")) return;
          state.user = { name, email };
          save("user");
          const destination = state.authDestination;
          toast(`Welcome${name ? `, ${name}` : ""}.`);
          if (state.pendingWishlist) {
            const id = state.pendingWishlist;
            state.pendingWishlist = null;
            if (!state.wishlist.includes(id)) { state.wishlist.push(id); save("wishlist"); toast("Added to your wishlist."); }
            renderProduct(getProduct(id));
          } else if (destination === "checkout") renderCheckout();
          else if (destination === "wishlist") renderWishlist();
          else renderAccount();
        }
        function renderAccount() {
          if (!state.user) { showAuth("login", "account"); return; }
          state.page = "account";
          app.innerHTML = `<section class="page shell"><div class="page-header"><button class="back-button" type="button" data-action="back">←</button><h1>Your account</h1></div>
            <div class="content-card"><p class="eyebrow" style="color:var(--muted)">Member profile</p><h2 style="margin:0;color:var(--navy)">${state.user.name}</h2><p class="section-subtitle">${state.user.email}</p>
              <div class="account-actions"><button class="button button-outline" type="button" data-action="orders">Order history (${state.orders.length})</button><button class="button" type="button" data-action="logout">Log out</button></div>
              <p class="demo-banner">This local demo profile is not a secure account. It is not connected to a database or shared between devices.</p>
            </div></section>`;
        }
        function renderOrders() {
          state.page = "orders";
          app.innerHTML = `<section class="page shell"><div class="page-header"><button class="back-button" type="button" data-action="account">←</button><h1>Order history</h1></div>
            ${state.orders.length ? state.orders.slice().reverse().map((order) => `<article class="content-card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><strong style="color:var(--navy)">${order.id}</strong><span class="order-status ${order.status === "Paid" ? "paid" : ""}">${order.status}</span></div><p class="notice">${order.payment} · ${new Date(order.createdAt).toLocaleString("id-ID")}</p><p style="font-weight:700;color:var(--navy)">${money(order.total)}</p><button class="button button-outline" type="button" data-action="payment" data-id="${order.id}">View payment</button></article>`).join("") : '<div class="empty-state"><h3>No orders yet</h3><p>Your placed orders will appear here.</p><button class="button" type="button" data-action="home">Explore products</button></div>'}</section>`;
        }
        function renderPayment(order) {
          if (!order) { toast("Order not found."); renderOrders(); return; }
          state.page = "payment";
          state.orderId = order.id;
          const expired = Date.now() >= order.expiresAt;
          const secondsLeft = Math.max(0, Math.floor((order.expiresAt - Date.now()) / 1000));
          const timer = `${String(Math.floor(secondsLeft / 3600)).padStart(2, "0")}:${String(Math.floor((secondsLeft % 3600) / 60)).padStart(2, "0")}:${String(secondsLeft % 60).padStart(2, "0")}`;
          app.innerHTML = `<section class="page shell"><div class="page-header"><button class="back-button" type="button" data-action="orders">←</button><h1>Payment</h1></div>
            <div class="content-card payment-box"><span class="order-status ${order.status === "Paid" ? "paid" : ""}">${order.status}</span><h2 style="margin-top:14px">${order.payment === "QRIS" ? "Scan to pay with QRIS" : `${order.payment} Virtual Account`}</h2><p class="notice">Order ${order.id}</p>
              ${order.payment === "QRIS" ? '<div class="qr-mock" aria-label="Decorative demo QR code"><span>DEMO ONLY</span></div>' : `<div class="code-box">${order.va}</div><p class="notice">Use the ${order.payment} Virtual Account number above in your banking app, then confirm the transfer.</p>`}
              <p class="countdown">${expired && order.status !== "Paid" ? "Payment deadline passed" : order.status === "Paid" ? "Payment complete" : `Payment deadline in ${timer}`}</p>
              <div class="summary-row summary-total"><span>Amount due</span><span>${money(order.total)}</span></div>
              ${order.status === "Pending" ? '<button class="button" type="button" data-action="simulate-payment">Simulate successful payment</button><p class="demo-banner" style="text-align:left">Sandbox preview only. This button simulates a successful payment; no payment gateway, valid QRIS code, stock reservation, or webhook is connected.</p>' : ""}
              ${order.status === "Paid" ? `<button class="button" type="button" data-action="confirmation">View confirmation</button>` : ""}
            </div></section>`;
          if (order.status === "Pending" && !expired) setTimeout(() => { if (state.page === "payment" && state.orderId === order.id) renderPayment(order); }, 1000);
        }
        function renderConfirmation(order) {
          state.page = "confirmation";
          app.innerHTML = `<section class="page shell"><div class="content-card payment-box"><span class="order-status paid">Payment confirmed</span><h2 style="margin-top:18px">Thank you for your order.</h2><p class="notice">Your NPD CLUB pieces are on their way.</p><div class="code-box">${order.id}</div><p class="summary-row summary-total"><span>Order status</span><span>Paid</span></p><p class="summary-row"><span>Amount paid</span><strong>${money(order.total)}</strong></p><button class="button" type="button" data-action="orders">View order history</button></div></section>`;
        }
        function placeOrder(event) {
          event.preventDefault();
          const form = event.currentTarget;
          if (!form.reportValidity()) return;
          const invalidIds = [];
          for (const item of state.cart) {
            const product = getProduct(item.id);
            if (!product || getStock(product, item.size, item.color) < item.quantity) invalidIds.push(item.id);
          }
          if (invalidIds.length) {
            state.cart = state.cart.filter((item) => !invalidIds.includes(item.id));
            save("cart");
            toast("Some items are out of stock and were removed from your cart.");
            renderCart();
            return;
          }
          const fields = new FormData(form);
          const total = state.cart.reduce((sum, item) => sum + getProduct(item.id).price * item.quantity, 0);
          const payment = String(fields.get("payment"));
          const order = {
            id: `NPD-${Date.now().toString().slice(-9)}`,
            items: state.cart.map((item) => ({ ...item })),
            total,
            payment,
            status: "Pending",
            createdAt: new Date().toISOString(),
            expiresAt: Date.now() + 24 * 60 * 60 * 1000,
            va: `${payment === "BCA" ? "3901" : payment === "BRI" ? "2621" : payment === "Mandiri" ? "8870" : "8808"}${Date.now().toString().slice(-10)}`
          };
          order.address = { name: fields.get("name"), phone: fields.get("phone"), address: fields.get("address"), city: fields.get("city"), postal: fields.get("postal") };
          state.orders.push(order);
          save("orders");
          state.cart = [];
          save("cart");
          state.orderId = order.id;
          renderPayment(order);
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
        function setStockOptions() {
          const product = getProduct(state.selectedProduct);
          if (!product) return;
          if (getStock(product, state.selectedSize, state.selectedColor) < 1) {
            const availableColor = colors.find((color) => getStock(product, state.selectedSize, color) > 0);
            if (availableColor) state.selectedColor = availableColor;
          }
          const stock = getStock(product, state.selectedSize, state.selectedColor);
          document.querySelectorAll('[data-action="size"]').forEach((button) => {
            const available = colors.some((color) => getStock(product, button.dataset.size, color) > 0);
            button.classList.toggle("unavailable", !available);
            button.disabled = !available;
            button.classList.toggle("selected", button.dataset.size === state.selectedSize);
          });
          document.querySelectorAll('[data-action="color"]').forEach((button) => {
            const available = getStock(product, state.selectedSize, button.dataset.color) > 0;
            button.classList.toggle("unavailable", !available);
            button.disabled = !available;
            button.classList.toggle("selected", button.dataset.color === state.selectedColor);
          });
          document.getElementById("color-label").textContent = state.selectedColor;
          document.getElementById("stock-message").textContent = isSoldOut(product) ? "Sold out in all sizes and colors." : stock ? `${stock} in stock for selected size and color.` : "This size and color are sold out.";
          const addButton = document.getElementById("detail-add");
          addButton.disabled = isSoldOut(product) || stock < 1;
          addButton.textContent = isSoldOut(product) ? "Sold Out" : "Add to Cart";
        }
        function toggleWishlist(id) {
          const product = getProduct(id);
          if (!product) return;
          if (!state.user) {
            state.pendingWishlist = id;
            showAuth("login", "wishlist");
            toast("Log in to save this piece.");
            return;
          }
          if (state.wishlist.includes(id)) {
            state.wishlist = state.wishlist.filter((item) => item !== id);
            toast("Removed from your wishlist.");
          } else {
            state.wishlist.push(id);
            toast("Added to your wishlist.");
          }
          save("wishlist");
          if (state.page === "wishlist") renderWishlist();
          else if (state.page === "detail") renderProduct(product);
          else renderHome();
        }
        function openMenu() {
          state.menuOpen = true;
          backdrop.classList.add("open");
          drawer.classList.add("open");
          drawer.setAttribute("aria-hidden", "false");
          document.body.style.overflow = "hidden";
        }
        function closeMenu() {
          state.menuOpen = false;
          backdrop.classList.remove("open");
          drawer.classList.remove("open");
          drawer.setAttribute("aria-hidden", "true");
          document.body.style.overflow = "";
        }
        function goBack() {
          if (state.page === "detail") renderHome();
          else if (state.page === "checkout") renderCart();
          else if (state.page === "payment") renderOrders();
          else renderHome();
        }
        function updateOrder(id, status) {
          const order = state.orders.find((item) => item.id === id);
          if (!order) return null;
          order.status = status;
          if (status === "Paid") {
            for (const item of order.items) {
              const key = `${item.size}|${item.color}`;
              state.stock[item.id][key] = Math.max(0, Number(state.stock[item.id][key]) - item.quantity);
            }
            save("stock");
          }
          save("orders");
          return order;
        }
        function navigateCollection(collection) {
          state.collection = collection;
          state.page = "home";
          closeMenu();
          renderHome();
          setTimeout(() => document.getElementById("products")?.scrollIntoView({ behavior: "smooth" }), 50);
        }

        document.addEventListener("click", (event) => {
          const target = event.target.closest("[data-action]");
          if (!target) return;
          const { action, id, collection, index, size, color, delta, tab } = target.dataset;
          event.preventDefault();
          switch (action) {
            case "home": state.collection = "All"; state.page = "home"; closeMenu(); renderHome(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
            case "open-menu": openMenu(); break;
            case "close-menu": closeMenu(); break;
            case "toggle-collections": {
              const submenu = document.getElementById("collection-submenu");
              const opened = submenu.classList.toggle("open");
              document.getElementById("collection-chevron").classList.toggle("rotate", opened);
              target.setAttribute("aria-expanded", String(opened));
              break;
            }
            case "collection": navigateCollection(collection); break;
            case "wishlist": closeMenu(); renderWishlist(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
            case "wishlist-toggle": toggleWishlist(id); break;
            case "cart": closeMenu(); renderCart(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
            case "account": closeMenu(); if (state.user) renderAccount(); else showAuth("login", "account"); window.scrollTo({ top: 0, behavior: "smooth" }); break;
            case "detail": { const product = getProduct(id); if (product) { closeMenu(); renderProduct(product); window.scrollTo({ top: 0, behavior: "smooth" }); } break; }
            case "quick-add": { const product = getProduct(id); if (product) addCart(product, "M", "Black"); break; }
            case "detail-add": { const product = getProduct(id); if (product) addCart(product, state.selectedSize, state.selectedColor); break; }
            case "size": state.selectedSize = size; setStockOptions(); break;
            case "color": state.selectedColor = color; setStockOptions(); break;
            case "gallery": {
              state.galleryIndex = Number(index);
              const images = [getProduct(state.selectedProduct).photo, "https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=1000&q=85", "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=1000&q=85"];
              document.getElementById("detail-image").src = images[state.galleryIndex];
              document.querySelectorAll(".gallery-thumbs button").forEach((button, thumbIndex) => button.classList.toggle("selected", thumbIndex === state.galleryIndex));
              break;
            }
            case "quantity": {
              const item = state.cart[Number(index)];
              if (!item) break;
              const product = getProduct(item.id);
              const next = item.quantity + Number(delta);
              if (next < 1) state.cart.splice(Number(index), 1);
              else if (next > getStock(product, item.size, item.color)) toast("You have added all available stock.");
              else item.quantity = next;
              save("cart"); renderCart(); break;
            }
            case "remove-cart": state.cart.splice(Number(index), 1); save("cart"); renderCart(); toast("Item removed from cart."); break;
            case "checkout": if (!state.user) showAuth("login", "checkout"); else renderCheckout(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
            case "auth-tab": state.authTab = tab; renderAuth(); break;
            case "forgot": toast("Password reset is not available in this local demo."); break;
            case "back": goBack(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
            case "logout": state.user = null; state.wishlist = []; save("user"); save("wishlist"); toast("You are logged out."); renderHome(); break;
            case "orders": renderOrders(); break;
            case "payment": { const order = state.orders.find((item) => item.id === id); renderPayment(order); break; }
            case "simulate-payment": {
              const order = state.orders.find((item) => item.id === state.orderId);
              if (!order || Date.now() > order.expiresAt) { toast("This payment has expired."); break; }
              const stockConflict = order.items.some((item) => Number(state.stock[item.id]?.[`${item.size}|${item.color}`] || 0) < item.quantity);
              if (stockConflict) { toast("Stock is no longer available. Please contact support."); break; }
              const updated = updateOrder(order.id, "Paid");
              if (updated) { toast("Demo payment successful."); renderConfirmation(updated); }
              break;
            }
            case "confirmation": { const order = state.orders.find((item) => item.id === state.orderId); if (order) renderConfirmation(order); break; }
          }
        });
        backdrop.addEventListener("click", closeMenu);
        document.addEventListener("keydown", (event) => { if (event.key === "Escape" && state.menuOpen) closeMenu(); });
        renderHome();
      })();
    </script>
  </body>
</html>
